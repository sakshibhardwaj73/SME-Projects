<!DOCTYPE html>
<html>
<body>
    <p id="demo"></p>
<script>
let op="*";
let x=5;
let y=10;

if (op=="+") {
    document.getElementById("demo").innerHTML = x + y;
} else if (op=="-") {
    document.getElementById("demo").innerHTML = x - y;
} else if (op=="*") {
    document.getElementById("demo").innerHTML = x * y;
} else if (op=="/") {
    document.getElementById("demo").innerHTML = x / y;
} else {
    document.getElementById("demo").innerHTML = "Invalid operator";
}
</script>

</body>
</html>
