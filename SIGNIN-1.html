
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Signup Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #42454f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 25px 0;
        }

        form {
            background: white;
            width: 350px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px gray;
        }

        h2 {
            text-align: center;
            color: #5145a5;
        }

        .logo {
            text-align: center;
            margin: 20px auto;
        }

        .input-box {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline: none;
            transition: transform 0.3s, border-color 0.3s;
        }

        input:not([type="submit"]):not([type="reset"]):not([type="checkbox"]):hover,
        select:hover,
        textarea:hover {
            transform: scale(1.04);
            border-color: #5145a5;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #5145a5;
        }

        textarea {
            height: 70px;
            resize: vertical;
        }

        .checkbox-box {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 18px 0;
            font-size: 13px;
        }

        .checkbox-box input {
            width: auto;
            margin-top: 3px;
        }

        .checkbox-box label {
            line-height: 1.5;
        }

        input[type="submit"],
        input[type="reset"] {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            cursor: pointer;
            border: none;
            background: #5145a5;
            color: white;
            font-size: 15px;
        }

        input[type="reset"] {
            background: #777;
        }

        input[type="submit"]:hover {
            background: #302580;
        }
    </style>

    <script>
        function validation() {
            let password = document.getElementById("password").value;
            let confirm = document.getElementById("confirm").value;
            let phone = document.getElementById("phone").value;

            if (!/^[6-9]\d{9}$/.test(phone)) {
                alert("Enter a valid 10-digit Indian mobile number");
                return false;
            }

            if (password.length < 6) {
                alert("Password must contain at least 6 characters");
                return false;
            }

            if (password !== confirm) {
                alert("Passwords do not match");
                return false;
            }

            if (!document.getElementById("correct").checked) {
                alert("Please confirm that your information is correct");
                return false;
            }

            alert("Signup successful!");
            return false;
        }
    </script>
</head>

<body>

<form name="myform" onsubmit="return validation()">

    <h2>Lamrin Tech Skills University</h2>

    <div class="logo">
        <img
            src="https://tse1.mm.bing.net/th/id/OIP.peTlY4MW6dM1Osd0xQf5GwAAAA?r=0&pid=Api&h=220&P=0"
            height="80" width="80" alt="University Logo">
    </div>

    <div class="input-box">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your name"
               minlength="2" required>
    </div>

    <div class="input-box">
        <label for="roll">Roll Number</label>
        <input type="text" id="roll" placeholder="Enter roll number"
               required>
    </div>

    <div class="input-box">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email"
               required>
    </div>

    <div class="input-box">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="10-digit mobile number"
               maxlength="10" pattern="[6-9][0-9]{9}" required>
    </div>

    <div class="input-box">
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" required>
    </div>

    <div class="input-box">
        <label for="gender">Gender</label>
        <select id="gender" required>
            <option value="">Select gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
            <option>Prefer not to say</option>
        </select>
    </div>

    <div class="input-box">
        <label for="department">Department / Batch</label>
        <select id="department" required>
            <option value="">Select department</option>
            <option>Computer Science Engineering</option>
            <option>Information Technology</option>
            <option>Electronics Engineering</option>
            <option>Mechanical Engineering</option>
            <option>Management</option>
            <option>Other</option>
        </select>
    </div>

    <div class="input-box">
        <label for="batch">Batch / Section</label>
        <input type="text" id="batch" placeholder="e.g. CSE-A, 2025-2029"
               required>
    </div>

    <div class="input-box">
        <label for="year">Academic Year</label>
        <select id="year" required>
            <option value="">Select academic year</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
            <option>5th Year</option>
        </select>
    </div>

    <div class="input-box">
        <label for="address">Address</label>
        <textarea id="address" placeholder="Enter your full address"
                  required></textarea>
    </div>

    <div class="input-box">
        <label for="password">Password</label>
        <input type="password" id="password"
               placeholder="Create password" minlength="6" required>
    </div>

    <div class="input-box">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm"
               placeholder="Re-enter password" required>
    </div>

    <div class="input-box">
        <label for="message">About Yourself (Optional)</label>
        <textarea id="message"
                  placeholder="Write something about yourself"></textarea>
    </div>

    <div class="checkbox-box">
        <input type="checkbox" id="correct" required>
        <label for="correct">
            I confirm that the information I have provided is correct.
        </label>
    </div>

    <input type="submit" value="Sign Up">
    <input type="reset" value="Reset">

</form>

</body>
</html>
