<!DOCTYPE html>
<html lang="en">
<head>
 <title>Document</title>
</head>
<body>
    <p id="demo"></p>
     <p id="demo1"></p>
   <script>
    let arr=[10,5,3,34,15];
    let min =arr[0];
    arr.forEach(function(value){
        if (value<min){
            min=value;

        }
    });
    document.getElementById("demo").innerHTML="Minimum = "+min;
    let max=arr[0];
    arr.forEach(function(value){
        if (value<max){
            min=value;

        }
    });
    document.getElementById("demo1").innerHTML="Maximum = "+max;
   </script> 
</body>
</html>
